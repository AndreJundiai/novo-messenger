name: App Android

on:
  push:
    branches: [main]
    paths: ["crates/**", "android/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Instala o cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - name: Compila o núcleo Rust para Android e gera as ligações Kotlin
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./android/build-rust.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Monta o APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: novo-messenger-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
