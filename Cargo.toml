[workspace]
resolver = "2"
members = ["crates/nm-core", "crates/nm-wasm", "crates/nm-cli", "crates/nm-chat", "crates/nm-ffi", "crates/uniffi-bindgen"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm]
inherits = "release"
opt-level = "s"
